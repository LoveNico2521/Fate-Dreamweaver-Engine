<!DOCTYPE html>
<html lang="zh-Hant" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>織夢者菲特《Fate》 - 安科推演系統 (Classic)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 🎨 主題變數設定 */
    .theme-dark {
      --bg-main: #020617; --bg-panel: #0f172a; --bg-box: rgba(15, 23, 42, 0.6);
      --text-main: #f1f5f9; --text-muted: #94a3b8; --border-main: #1e293b;
      --input-bg: #1e293b; --input-border: #334155;
    }
    .theme-light {
      --bg-main: #f1f5f9; --bg-panel: #ffffff; --bg-box: rgba(248, 250, 252, 0.8);
      --text-main: #0f172a; --text-muted: #475569; --border-main: #cbd5e1;
      --input-bg: #ffffff; --input-border: #cbd5e1;
    }
    .theme-gold {
      --bg-main: #1c1917; --bg-panel: #292524; --bg-box: rgba(41, 37, 36, 0.6);
      --text-main: #fef3c7; --text-muted: #d6d3d1; --border-main: #44403c;
      --input-bg: #44403c; --input-border: #57534e;
    }

    /* 套用主題顏色 */
    body { background-color: var(--bg-main); color: var(--text-main); }
    .main-container { background-color: var(--bg-panel); border-color: var(--border-main); }
    .panel { background-color: var(--bg-box); border-color: var(--border-main); }
    .text-muted { color: var(--text-muted); }
    .border-default { border-color: var(--border-main); }

    /* 🌟 強制覆蓋原生輸入框與下拉選單 🌟 */
    input:not([type="checkbox"]), select, textarea {
      background-color: var(--input-bg) !important;
      border-color: var(--input-border) !important;
      color: var(--text-main) !important;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }
    
    select option {
      background-color: var(--bg-panel) !important;
      color: var(--text-main) !important;
    }
    
    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
      background-repeat: no-repeat !important;
      background-position: right 0.5rem center !important;
      background-size: 1em !important;
      padding-right: 2rem !important;
    }
    .theme-light select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f172a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
    }

    ::placeholder { color: var(--text-muted) !important; opacity: 0.7; }

    #settings-modal-content, #confirm-modal-content {
      background-color: var(--bg-panel) !important;
      border-color: var(--border-main) !important;
      color: var(--text-main) !important;
    }

    /* 覆蓋寫死的 Tailwind 顏色，確保對比度 */
    .theme-light .text-slate-100, .theme-light .text-slate-200 { color: #0f172a !important; }
    .theme-light .text-slate-300, .theme-light .text-slate-400 { color: #334155 !important; }
    .theme-light .text-slate-500 { color: #64748b !important; }
    
    .theme-gold .text-slate-100, .theme-gold .text-slate-200 { color: #fef3c7 !important; }
    .theme-gold .text-slate-300, .theme-gold .text-slate-400 { color: #d6d3d1 !important; }
    .theme-gold .text-slate-500 { color: #a8a29e !important; }

    /* 輕柔落桌動畫 */
    @keyframes soft-drop {
      0% { transform: translateY(-10px) scale(0.98); opacity: 0.4; }
      60% { transform: translateY(2px) scale(1.01); opacity: 0.9; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .animate-roll { animation: soft-drop 0.25s ease-out; }

    /* 霓虹脈衝動畫 */
    @keyframes glow-green {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); border-color: rgba(16, 185, 129, 1); }
      50% { box-shadow: 0 0 15px 5px rgba(16, 185, 129, 0.4); border-color: rgba(16, 185, 129, 0.8); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); border-color: rgba(16, 185, 129, 0.4); }
    }
    @keyframes glow-red {
      0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); border-color: rgba(244, 63, 94, 1); }
      50% { box-shadow: 0 0 15px 5px rgba(244, 63, 94, 0.4); border-color: rgba(244, 63, 94, 0.8); }
      100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); border-color: rgba(244, 63, 94, 0.4); }
    }
    @keyframes glow-purple {
      0% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7); border-color: rgba(168, 85, 247, 1); }
      50% { box-shadow: 0 0 20px 8px rgba(168, 85, 247, 0.4); border-color: rgba(168, 85, 247, 0.8); }
      100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); border-color: rgba(168, 85, 247, 0.4); }
    }
    .glow-cs { animation: glow-green 1.2s ease-out; }
    .glow-cf { animation: glow-red 1.2s ease-out; }
    .glow-high { animation: glow-purple 1.5s ease-out; }

    /* 美化捲軸 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.5); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.8); }

    body { user-select: none; -webkit-user-select: none; }
    input, textarea, select { user-select: auto; -webkit-user-select: auto; }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    .virtual-scroll-item { content-visibility: auto; contain-intrinsic-size: 60px; }
  </style>
</head>
<body class="h-screen flex items-center justify-center p-2 md:p-4 font-sans overflow-hidden transition-colors duration-300">

  <div class="w-full max-w-[1600px] h-full max-h-[900px] min-h-[800px] main-container border rounded-3xl shadow-2xl flex flex-col p-4 md:p-6 space-y-4 overflow-hidden relative transition-colors duration-300">
    
    <!-- 頂部標題列 -->
    <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-default pb-3 gap-2 shrink-0">
      <div class="flex items-center gap-3">
        <div class="px-3 py-1 bg-indigo-500/10 border border-indigo-500/30 rounded-xl text-indigo-500 font-black text-sm tracking-wider uppercase">
          織夢機 (經典)
        </div>
        <h1 class="text-xl md:text-2xl font-black bg-gradient-to-r from-amber-300 via-amber-400 to-amber-500 bg-clip-text text-transparent">
          織夢者菲特《Fate》
        </h1>
      </div>
      <div class="flex items-center gap-4">
        <div class="hidden md:flex text-xs text-muted font-mono items-center gap-4">
          <span>ra (<= 目標值) / ro (>= 目標值) 雙檢定</span>
          <span>•</span>
          <span>與基準同向 ➔ 深入 (+1)</span>
        </div>
        <button onclick="openSettings()" class="p-2 bg-slate-500/10 hover:bg-slate-500/20 rounded-full transition-colors text-xl border border-transparent" title="設定">
          ⚙️
        </button>
      </div>
    </div>

    <!-- 主內容區 -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 md:gap-6 flex-1 min-h-0">
      
      <!-- 左側控制欄 -->
      <div class="col-span-1 md:col-span-4 panel border rounded-2xl p-4 md:p-5 flex flex-col gap-4 overflow-y-auto">
        
        <div class="space-y-4">
          <div class="text-xs font-bold text-muted tracking-wider uppercase border-b border-default pb-2 flex justify-between items-center">
            <span>⚙️ 推演參數設定</span>
            <span class="text-[9px] opacity-70">PC: [空白鍵]=投下(1d100)</span>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1">
              <label class="block text-xs font-medium text-muted">投下次數</label>
              <div class="flex items-center border border-default rounded-xl overflow-hidden bg-black/10">
                <button onclick="adjustCount(-1)" class="px-3 py-2 md:py-1.5 hover:bg-slate-500/20 font-bold transition">-</button>
                <input id="dice-count" type="number" min="1" max="50" value="1" class="w-full bg-transparent text-center text-sm md:text-xs font-bold text-amber-500 focus:outline-none border-0" />
                <button onclick="adjustCount(1)" class="px-3 py-2 md:py-1.5 hover:bg-slate-500/20 font-bold transition">+</button>
              </div>
            </div>

            <div class="space-y-1">
              <label class="block text-xs font-medium text-muted">基礎加值 (Boost)</label>
              <div class="flex items-center border border-default rounded-xl overflow-hidden bg-black/10">
                <button onclick="adjustBoost(-1)" class="px-3 py-2 md:py-1.5 hover:bg-slate-500/20 font-bold transition">-</button>
                <input id="base-boost" type="number" value="0" class="w-full bg-transparent text-center text-sm md:text-xs font-bold text-emerald-500 focus:outline-none border-0" />
                <button onclick="adjustBoost(1)" class="px-3 py-2 md:py-1.5 hover:bg-slate-500/20 font-bold transition">+</button>
              </div>
            </div>
          </div>

          <div class="space-y-2 border border-default rounded-xl p-3 bg-black/10">
            <div class="flex justify-between items-center">
              <label class="text-xs font-bold text-amber-500">🎯 檢定模式與目標值</label>
              <span id="mode-desc" class="text-[10px] text-muted font-mono">ra (<= 目標值成功)</span>
            </div>
            
            <div class="grid grid-cols-2 gap-2">
              <div class="flex rounded-lg overflow-hidden border border-default p-0.5">
                <button id="btn-mode-ra" onclick="setCheckMode('ra')" class="flex-1 py-1.5 md:py-1 text-xs font-bold rounded-md bg-indigo-600 text-white transition">ra (<=)</button>
                <button id="btn-mode-ro" onclick="setCheckMode('ro')" class="flex-1 py-1.5 md:py-1 text-xs font-bold rounded-md opacity-50 hover:opacity-100 transition">ro (>=)</button>
              </div>
              <div class="flex items-center border border-default rounded-lg overflow-hidden px-2 bg-black/10">
                <span class="text-xs text-muted font-bold mr-1">目標:</span>
                <input id="target-value" type="number" min="1" max="100" value="50" class="w-full bg-transparent text-center text-sm md:text-xs font-bold text-amber-500 focus:outline-none border-0" />
              </div>
            </div>
          </div>
        </div>

        <div class="space-y-3 pt-1">
          <button onclick="executeRoll('1d10')" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl shadow-lg transition-all flex flex-col items-center justify-center gap-1 border border-indigo-400/30">
            <span class="text-base tracking-wide">🎲 投下 1d10 安科連鎖</span>
            <span class="text-[10px] opacity-80">1d2=1: 大成功 | 1d2=2: 大失敗</span>
          </button>
          <button onclick="executeRoll('1d100')" class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl shadow-lg transition-all flex flex-col items-center justify-center gap-1 border border-emerald-400/30">
            <span class="text-base tracking-wide">🎯 投下 1d100 劇情判定 (ra/ro)</span>
            <span class="text-[10px] opacity-80">1~5 ➔ 大失敗 (CF) | 96~100 ➔ 大成功 (CS)</span>
          </button>
        </div>

        <div class="space-y-1.5 pt-3 border-t border-default">
          <span class="text-[11px] font-medium text-muted">通用標準骰子</span>
          <div class="grid grid-cols-5 gap-2">
            <button onclick="executeRoll('d4')" class="py-2 md:py-1.5 bg-slate-500/10 hover:bg-slate-500/20 rounded-xl text-xs font-bold transition">d4</button>
            <button onclick="executeRoll('d6')" class="py-2 md:py-1.5 bg-slate-500/10 hover:bg-slate-500/20 rounded-xl text-xs font-bold transition">d6</button>
            <button onclick="executeRoll('d8')" class="py-2 md:py-1.5 bg-slate-500/10 hover:bg-slate-500/20 rounded-xl text-xs font-bold transition">d8</button>
            <button onclick="executeRoll('d12')" class="py-2 md:py-1.5 bg-slate-500/10 hover:bg-slate-500/20 rounded-xl text-xs font-bold transition">d12</button>
            <button onclick="executeRoll('d20')" class="py-2 md:py-1.5 bg-slate-500/10 hover:bg-slate-500/20 rounded-xl text-xs font-bold transition">d20</button>
          </div>
          <div class="flex gap-2 mt-2">
            <input id="custom-dice-input" type="text" placeholder="如 8d50, ra50 1d100" class="flex-1 border border-default rounded-lg px-2 py-1.5 text-xs focus:outline-none" />
            <button onclick="rollCustomDice()" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 rounded-lg text-xs font-bold text-white transition">投下</button>
          </div>
        </div>

        <div class="flex items-center justify-between border border-default rounded-xl p-3 mt-2 shrink-0 bg-black/10">
          <label class="text-xs font-bold text-muted cursor-pointer flex-1" for="auto-copy-toggle">自動複製公式</label>
          <input id="auto-copy-toggle" type="checkbox" onchange="saveSettings()" class="w-4 h-4 text-indigo-600 bg-slate-800 border-slate-600 rounded focus:ring-indigo-500 focus:ring-2 cursor-pointer accent-indigo-500">
        </div>

      </div>

      <!-- 右側展示區 -->
      <div class="col-span-1 md:col-span-8 flex flex-col space-y-4 min-h-0">
        
        <div class="flex-1 panel border rounded-2xl p-4 md:p-5 flex flex-col relative overflow-hidden shadow-inner min-h-[300px] md:min-h-0">
          <div class="flex flex-col md:flex-row md:justify-between md:items-center border-b border-default pb-2 mb-3 gap-2">
            <span class="text-xs font-bold text-amber-500 tracking-wider uppercase">📊 即時安科推演圖譜</span>
            <div id="strike-badges" class="flex gap-2 text-xs font-bold flex-wrap"></div>
          </div>

          <div id="dice-container" class="flex-1 overflow-y-auto space-y-3 pr-2 scroll-smooth">
            <div id="empty-state" class="h-full flex flex-col items-center justify-center text-muted space-y-3 py-10">
              <div class="text-4xl">🪡</div>
              <div class="text-sm md:text-base text-center px-4 tracking-widest leading-relaxed">
                命運的經緯在此交織<br>
                <span class="text-indigo-500 font-bold">織夢者菲特</span> 將為你落下第一顆骰子
              </div>
            </div>
            <div id="chain-flow-display" class="space-y-3 hidden"></div>
          </div>
        </div>

        <div id="total-summary" class="hidden bg-indigo-950/40 border border-indigo-500/30 rounded-2xl p-3 flex flex-col md:flex-row justify-center items-center text-sm md:text-base font-bold text-indigo-500 shadow-lg transition-all gap-2 shrink-0"></div>

        <div class="h-40 md:h-44 panel border rounded-2xl p-4 flex flex-col min-h-0 space-y-2 shrink-0">
          <div class="flex justify-between items-center text-xs text-muted">
            <span class="font-bold flex items-center gap-1.5">📜 安科推演紀錄 (點擊複製)</span>
            <div class="flex items-center gap-1 md:gap-2">
              <button onclick="exportHistoryToCSV()" class="text-emerald-600 hover:text-emerald-500 bg-emerald-500/10 px-2 py-1 rounded transition">匯出 CSV</button>
              <button onclick="askClearHistory()" class="hover:opacity-70 underline px-2 py-1 transition">清除</button>
            </div>
          </div>
          <div id="history-log" class="flex-1 overflow-y-auto text-xs space-y-1.5 font-mono pr-1">
            <div class="text-muted text-center py-4">尚無推演紀錄</div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- ⚙️ 設定彈窗 -->
  <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-[250] transition-opacity">
    <div class="border rounded-2xl p-6 shadow-2xl max-w-md w-full mx-4 transform scale-95 transition-transform duration-200 max-h-[90vh] overflow-y-auto" id="settings-modal-content">
      <div class="flex justify-between items-center mb-6 border-b border-default pb-2">
        <h2 class="text-xl font-bold flex items-center gap-2">⚙️ 系統設定與選項</h2>
        <button onclick="hideSettings()" class="opacity-50 hover:opacity-100 text-2xl font-bold transition">&times;</button>
      </div>
      
      <div class="space-y-6">
        <div>
          <h3 class="text-sm font-bold text-indigo-500 mb-2">🎨 介面主題</h3>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="setTheme('theme-dark')" style="background-color: #0f172a; color: #f1f5f9; border-color: #334155;" class="py-2 border rounded-lg text-xs hover:opacity-80 shadow-sm transition-all font-bold">深色 (預設)</button>
            <button onclick="setTheme('theme-light')" style="background-color: #ffffff; color: #0f172a; border-color: #cbd5e1;" class="py-2 border rounded-lg text-xs hover:opacity-80 shadow-sm transition-all font-bold">淺色</button>
            <button onclick="setTheme('theme-gold')" style="background-color: #292524; color: #fef3c7; border-color: #d97706;" class="py-2 border rounded-lg text-xs hover:opacity-80 shadow-sm transition-all font-bold">金黃 (Fate)</button>
          </div>
        </div>

        <div>
          <h3 class="text-sm font-bold text-indigo-500 mb-2">📝 複製/匯出格式</h3>
          <select id="output-format" onchange="saveSettings()" class="w-full border border-default rounded-xl px-2 py-2 text-sm focus:outline-none">
            <option value="plain">純文字 (適合記事本)</option>
            <option value="markdown">Markdown 粗體 (適合論壇/Discord)</option>
          </select>
        </div>

        <div>
          <h3 class="text-sm font-bold text-indigo-500 mb-2">🎲 1d100 Boost 模式</h3>
          <select id="boost-mode-100" onchange="saveSettings()" class="w-full border border-default rounded-xl px-2 py-2 text-sm focus:outline-none">
            <option value="v1">v1: 降面 1d(100-Boost) + Boost (CF看原始值)</option>
            <option value="v2">v2: 原始 1d100 + Boost (CF看原始值)</option>
            <option value="v3">v3: 降面 1d(100-|Boost|) + 正Boost加值 (CF/CS看最終值)</option>
          </select>
        </div>

        <div>
          <h3 class="text-sm font-bold text-fuchsia-500 mb-2 flex items-center gap-1">🧪 測試序列 (Debug)</h3>
          <div class="bg-fuchsia-950/20 border border-fuchsia-500/30 rounded-xl p-3 text-xs">
            <input id="debug-seq" type="text" placeholder="例: 96, 10, 1, 50" class="w-full border border-fuchsia-500/30 rounded px-2 py-1.5 focus:outline-none font-mono" />
            <p class="text-[10px] text-fuchsia-500/80 mt-1 leading-tight">輸入逗號分隔的數字，將依序取代隨機結果。用完後回歸隨機。</p>
          </div>
        </div>
      </div>

      <div class="mt-6 text-right">
        <button onclick="hideSettings()" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-white transition">完成</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-4 right-4 z-[300] flex flex-col gap-2 pointer-events-none"></div>

  <div id="confirm-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-[290] transition-opacity">
    <div class="border rounded-2xl p-6 shadow-2xl max-w-sm w-full mx-4 text-center transform scale-95 transition-transform duration-200" id="confirm-modal-content">
      <div class="text-3xl mb-3">🧹</div>
      <div class="text-lg font-bold mb-6" id="confirm-msg">確定嗎喵？</div>
      <div class="flex justify-center gap-4">
        <button onclick="hideConfirm()" class="px-5 py-2.5 bg-slate-500/20 hover:bg-slate-500/30 rounded-xl font-bold transition">取消</button>
        <button id="confirm-yes-btn" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-500 rounded-xl font-bold text-white transition shadow-lg shadow-rose-500/30">確定</button>
      </div>
    </div>
  </div>

  <script>
    const countInput = document.getElementById('dice-count');
    const boostInput = document.getElementById('base-boost');
    const targetValueInput = document.getElementById('target-value');
    const boostMode100Input = document.getElementById('boost-mode-100');
    const customDiceInput = document.getElementById('custom-dice-input');
    const emptyState = document.getElementById('empty-state');
    const chainFlowDisplay = document.getElementById('chain-flow-display');
    const strikeBadges = document.getElementById('strike-badges');
    const diceContainer = document.getElementById('dice-container');
    const historyLog = document.getElementById('history-log');
    const totalSummary = document.getElementById('total-summary');
    const debugSeqInput = document.getElementById('debug-seq');
    const outputFormatInput = document.getElementById('output-format');
    const autoCopyToggle = document.getElementById('auto-copy-toggle'); 
    
    document.addEventListener('contextmenu', e => e.preventDefault());
    let checkMode = 'ra';
    let history = [];

    // === 基礎邏輯 ===
    function openSettings() {
      const modal = document.getElementById('settings-modal');
      modal.classList.remove('hidden'); modal.classList.add('flex');
      setTimeout(() => document.getElementById('settings-modal-content').classList.replace('scale-95', 'scale-100'), 10);
    }
    function hideSettings() {
      const modal = document.getElementById('settings-modal');
      document.getElementById('settings-modal-content').classList.replace('scale-100', 'scale-95');
      setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 200);
    }

    function setTheme(themeName) {
      document.documentElement.className = themeName;
      localStorage.setItem('fate_theme', themeName);
      showToast(`🎨 已切換至 ${themeName.replace('theme-', '')} 主題`, 'info');
    }

    // 🌟 升級為密碼學安全隨機數 (Crypto RNG)
    function getRnd(max, debugSeq, state) {
      if (debugSeq && debugSeq.length > 0 && state.index < debugSeq.length) {
        let val = debugSeq[state.index++]; 
        return Math.max(1, Math.min(max, val));
      }
      const array = new Uint32Array(1);
      window.crypto.getRandomValues(array);
      return (array[0] % max) + 1;
    }

    function rollCustomDice() {
      let val = customDiceInput.value.trim().toLowerCase();
      if (!val) return showToast('❌ 請輸入自訂骰子 (如 1d100, ra50 1d100)', 'error');

      // 支援運算符與數字間可包含任意空格 (例: 1d100 + 5, ra 50 1d100 - 10)
      const regex = /^(?:(ra|ro)\s*(\d+)\s*)?(\d*)d(\d+)(?:\s*([+-]\s*\d+))?$/i;
      const match = val.match(regex);
      if (match) {
        const mode = match[1] ? match[1].toLowerCase() : null;
        const targetVal = match[2] ? parseInt(match[2]) : null;
        const count = match[3] ? parseInt(match[3]) : 1;
        const sides = parseInt(match[4]);
        const modifier = match[5] ? parseInt(match[5].replace(/\s+/g, '')) : 0;

        // 嚴格邊界防呆 (上限解放至 50)
        if (count < 1 || count > 50) return showToast('❌ 骰子數量必須介於 1 到 50 顆', 'error');
        if (sides < 2 || sides > 10000) return showToast('❌ 骰面必須介於 2 到 10000 面', 'error');
        if (targetVal !== null && (targetVal < 1 || targetVal > 10000)) return showToast('❌ 目標值範圍需為 1 ~ 10000', 'error');

        let debugSeq = [], isDebug = false;
        if (debugSeqInput && debugSeqInput.value.trim() !== '') {
          isDebug = true; 
          debugSeq = debugSeqInput.value.split(',').map(s => Number(s.trim())).filter(n => !isNaN(n));
        }
        const debugState = { index: 0 };

        // 自訂骰子獨立運算，不受基礎加值 (base-boost) 影響
        let total = 0, rolls = [];
        for (let i = 0; i < count; i++) {
          let r = getRnd(sides, debugSeq, debugState);
          rolls.push(r); total += r;
        }
        total += modifier;

        const modStr = modifier !== 0 ? ` ${modifier > 0 ? '+' : ''}${modifier}` : '';
        const rollsStr = rolls.length > 1 ? `[${rolls.join(', ')}]${modStr} = ` : '';
        const diceExpr = `${count}d${sides}${modStr}`;
        const formula = `${diceExpr} = ${rollsStr}${total}`;

        let checkDetail = '';
        let resultMsg = `🎲 自訂擲骰：${formula}`;

        if (mode && targetVal !== null) {
          const isSuccess = (mode === 'ra') ? (total <= targetVal) : (total >= targetVal);
          checkDetail = `[${mode.toUpperCase()} ${mode === 'ra' ? '<=' : '>='} ${targetVal}] ➔ ${isSuccess ? '✅ 成功' : '❌ 失敗'}`;
          resultMsg = `🎲 自訂檢定：${formula} | ${checkDetail}`;
        }

        const mockRun = {
          steps: [{ 
            levelStr: 'custom', 
            type: diceExpr, 
            raw: total, 
            final: total, 
            extraD2: null, 
            outcome: '普通', 
            msg: resultMsg, 
            checkDetail: checkDetail 
          }],
          finalStack: 0, baseOutcome: null
        };

        emptyState.classList.add('hidden'); chainFlowDisplay.classList.remove('hidden'); totalSummary.classList.add('hidden');
        renderFlow([mockRun], 1);

        const debugText = isDebug ? '[🧪測試] ' : '';
        const summaryStr = mode && targetVal !== null 
          ? `${debugText}自訂 ${mode.toUpperCase()}${targetVal} (${diceExpr}) ➔ 結果: ${total} | ${checkDetail}`
          : `${debugText}自訂擲骰 (${diceExpr}) ➔ 結果: ${total}`;

        addHistory(summaryStr, formula);
        showToast('🎲 自訂擲骰完成！', 'success');

        if (autoCopyToggle.checked) {
          navigator.clipboard.writeText(formula).then(() => showToast(`📋 已自動複製：${formula}`, 'success'));
        }
      } else {
        showToast('❌ 格式錯誤，請輸入如 1d100, 8d50, ra50 1d100 或 ro25 1d75', 'error');
      }
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      let bgClass = 'bg-slate-700 text-slate-100';
      if (type === 'success') bgClass = 'bg-emerald-600 text-white';
      if (type === 'error') bgClass = 'bg-rose-600 text-white';
      if (type === 'info') bgClass = 'bg-indigo-600 text-white';
      toast.className = `px-4 py-3 rounded-xl text-sm font-bold shadow-2xl transition-all duration-300 transform translate-y-4 opacity-0 pointer-events-auto flex items-center gap-2 border border-white/10 ${bgClass}`;
      toast.innerHTML = msg;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('translate-y-4', 'opacity-0'));
      setTimeout(() => { toast.classList.add('translate-y-4', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 2500);
    }

    function askClearHistory() {
      if (history.length === 0) return;
      const modal = document.getElementById('confirm-modal');
      const content = document.getElementById('confirm-modal-content');
      const yesBtn = document.getElementById('confirm-yes-btn');
      modal.classList.remove('hidden'); modal.classList.add('flex');
      setTimeout(() => content.classList.add('scale-100'), 10);
      const newYesBtn = yesBtn.cloneNode(true);
      yesBtn.parentNode.replaceChild(newYesBtn, yesBtn);
      newYesBtn.onclick = () => {
        history = []; saveHistory(); renderHistory(); hideConfirm(); showToast('🗑️ 歷史紀錄已清除喵！', 'success');
      };
    }
    function hideConfirm() {
      const modal = document.getElementById('confirm-modal');
      document.getElementById('confirm-modal-content').classList.replace('scale-100', 'scale-95');
      setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 200);
    }

    function safeGet(key, fallback) { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; } }
    function safeSet(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

    function loadSettings() {
      const savedTheme = localStorage.getItem('fate_theme') || 'theme-dark';
      document.documentElement.className = savedTheme;
      
      const s = safeGet('fate_dreamweaver_settings', null);
      if (s) {
        countInput.value = s.count || 1; boostInput.value = s.boost || 0; targetValueInput.value = s.target || 50;
        boostMode100Input.value = s.boostMode100 || 'v2'; outputFormatInput.value = s.outputFormat || 'plain';
        setCheckMode(s.mode || 'ra');
      }
      
      const savedHistory = safeGet('fate_dreamweaver_history', []);
      if (Array.isArray(savedHistory)) history = savedHistory.slice(0, 200); 
      
      renderHistory();
    }

    function saveSettings() {
      safeSet('fate_dreamweaver_settings', {
        count: Math.floor(Number(countInput.value)) || 1, boost: Math.floor(Number(boostInput.value)) || 0, target: Math.floor(Number(targetValueInput.value)) || 50,
        boostMode100: boostMode100Input.value, mode: checkMode, outputFormat: outputFormatInput.value
      });
    }
    function saveHistory() { safeSet('fate_dreamweaver_history', history); }

    function setCheckMode(mode) {
      checkMode = mode;
      const btnRa = document.getElementById('btn-mode-ra');
      const btnRo = document.getElementById('btn-mode-ro');
      const modeDesc = document.getElementById('mode-desc');
      if (mode === 'ra') {
        btnRa.className = "flex-1 py-1.5 md:py-1 text-xs font-bold rounded-md bg-indigo-600 text-white transition";
        btnRo.className = "flex-1 py-1.5 md:py-1 text-xs font-bold rounded-md opacity-50 hover:opacity-100 transition";
        modeDesc.innerText = "ra (<= 目標值成功)";
      } else {
        btnRo.className = "flex-1 py-1.5 md:py-1 text-xs font-bold rounded-md bg-emerald-600 text-white transition";
        btnRa.className = "flex-1 py-1.5 md:py-1 text-xs font-bold rounded-md opacity-50 hover:opacity-100 transition";
        modeDesc.innerText = "ro (>= 目標值成功)";
      }
      saveSettings();
    }

    // 上限解放至 50
    function adjustCount(delta) { let val = Math.floor(Number(countInput.value)) || 1; countInput.value = Math.max(1, Math.min(50, val + delta)); saveSettings(); }
    function adjustBoost(delta) { let val = Math.floor(Number(boostInput.value)) || 0; boostInput.value = val + delta; saveSettings(); }
    function playAnimation() { diceContainer.classList.remove('animate-roll'); void diceContainer.offsetWidth; diceContainer.classList.add('animate-roll'); }

    function rollChainEngine(startType, boost, targetVal, mode, debugSeq, state, boostMode100) {
      let steps = [], currentLevel = 0, initialChainOutcome = null, currentStack = 0;            
      function getDieType(lvl) { return lvl === 0 ? startType : '1d10'; }
      let continueLoop = true, loopSafety = 0;

      while (continueLoop && loopSafety < 50) {
        loopSafety++;
        let dieType = getDieType(currentLevel); let levelStr = `s${currentLevel}`;

        if (dieType === '1d100') {
          let sides = 100, raw100, final100, isCF = false, isCS = false;
          if (boostMode100 === 'v1') {
            sides = Math.max(1, 100 - boost); raw100 = getRnd(sides, debugSeq, state); final100 = raw100 + boost;
            isCF = (raw100 <= 5); isCS = (final100 >= 96);
          } else if (boostMode100 === 'v2') {
            raw100 = getRnd(100, debugSeq, state); final100 = raw100 + boost;
            isCF = (raw100 <= 5); isCS = (final100 >= 96);
          } else {
            sides = Math.max(1, 100 - Math.abs(boost)); raw100 = getRnd(sides, debugSeq, state);
            final100 = (boost >= 0) ? (raw100 + boost) : raw100;
            isCF = (final100 <= 5); isCS = (final100 >= 96);
          }
          
          let isSuccess = (mode === 'ra') ? (final100 <= targetVal) : (final100 >= targetVal);
          let checkDetail = `[${mode.toUpperCase()} ${mode === 'ra' ? '<=' : '>='} ${targetVal}] ➔ ${isSuccess ? '✅ 成功' : '❌ 失敗'}`;
          let step = { levelStr, type: '1d100', raw: raw100, final: final100, extraD2: null, outcome: null, msg: '', checkDetail };

          if (isCS) {
            const currentOutcome = '大成功';
            if (!initialChainOutcome) initialChainOutcome = currentOutcome;
            currentStack++; step.outcome = currentOutcome; currentLevel++;
            step.msg = `✨ 1d100 = ${raw100} (CS: 最終值>=96) ➔ 進入 s${currentLevel} (1d10)！ | ${checkDetail}`;
            steps.push(step); continueLoop = true;
          } else if (isCF) {
            const currentOutcome = '大失敗';
            if (!initialChainOutcome) initialChainOutcome = currentOutcome;
            currentStack++; step.outcome = currentOutcome; currentLevel++;
            step.msg = `💥 1d100 = ${raw100} (CF: ${boostMode100 === 'v3' ? '最終值<=5' : '原始值<=5'}) ➔ 進入 s${currentLevel} (1d10)！ | ${checkDetail}`;
            steps.push(step); continueLoop = true;
          } else {
            step.msg = `1d100 結果: ${raw100} | ${checkDetail}`;
            steps.push(step); continueLoop = false;
          }
        } else if (dieType === '1d10') {
          const raw10 = getRnd(10, debugSeq, state); const final10 = raw10 + boost;
          let step = { levelStr, type: '1d10', raw: raw10, final: final10, extraD2: null, outcome: null, msg: '', checkDetail: '' };
          if (raw10 === 10) {
            const d2 = getRnd(2, debugSeq, state); step.extraD2 = d2;
            const currentOutcome = (d2 === 1) ? '大成功' : '大失敗';
            step.outcome = currentOutcome;
            if (!initialChainOutcome) initialChainOutcome = currentOutcome;
            if (currentOutcome === initialChainOutcome) {
              currentStack++; currentLevel++;
              step.msg = `${currentOutcome === '大成功' ? '✨' : '💥'} 1d10=10 ➔ 1d2=${d2} (${currentOutcome})！與基準同向 ➔ 深入 s${currentLevel}！`;
            } else {
              if (currentStack > 0) currentStack--;
              if (currentLevel > 0) {
                currentLevel--;
                step.msg = `${currentOutcome === '大成功' ? '✨' : '💥'} 1d10=10 ➔ 1d2=${d2} (${currentOutcome})！與基準反向 ➔ 退回 s${currentLevel}！`;
              } else {
                step.msg = `${currentOutcome === '大成功' ? '✨' : '💥'} 1d10=10 ➔ 1d2=${d2} (${currentOutcome})！退回起始層 s0！`;
              }
            }
            steps.push(step); continueLoop = true;
          } else {
            step.msg = `1d10 普通結果 ➔ 原始: ${raw10}`;
            steps.push(step); continueLoop = false;
          }
        } else {
          const sides = parseInt(dieType.replace('d', '')); const raw = getRnd(sides, debugSeq, state); const final = raw + boost;
          let isSuccess = (mode === 'ra') ? (final <= targetVal) : (final >= targetVal);
          let checkDetail = `[${mode.toUpperCase()} ${mode === 'ra' ? '<=' : '>='} ${targetVal}] ➔ ${isSuccess ? '✅ 成功' : '❌ 失敗'}`;
          steps.push({ levelStr, type: dieType, raw, final, extraD2: null, outcome: null, msg: `擲出 ${dieType} ➔ 原始: ${raw} | ${checkDetail}`, checkDetail });
          continueLoop = false;
        }
      }
      return { steps, finalStack: currentStack, baseOutcome: initialChainOutcome };
    }

    function renderBadges(totalSuccessStacks, totalFailStacks, isDebug) {
      let strikeHtml = '';
      if (totalSuccessStacks > 0) strikeHtml += `<span class="px-2 py-1 bg-emerald-950/50 border border-emerald-500/60 text-emerald-400 rounded-full text-[11px]">✨ 淨計: ${totalSuccessStacks}重大成功</span>`;
      if (totalFailStacks > 0) strikeHtml += `<span class="px-2 py-1 bg-rose-950/50 border border-rose-500/60 text-rose-400 rounded-full text-[11px]">💥 淨計: ${totalFailStacks}重大失敗</span>`;
      if (totalSuccessStacks === 0 && totalFailStacks === 0) strikeHtml += `<span class="px-2 py-1 bg-slate-500/10 border border-slate-500/30 text-muted rounded-full text-[11px]">⚪ 淨計: 0 Stacks</span>`;
      if (isDebug) strikeHtml += `<span class="px-2 py-1 bg-fuchsia-950/50 border border-fuchsia-500/60 text-fuchsia-400 rounded-full text-[11px]">🧪 測試模式</span>`;
      strikeBadges.innerHTML = strikeHtml;
    }

    function renderFlow(allRuns, count) {
      let flowHtml = '';
      allRuns.forEach((run, idx) => {
        if (count > 1) flowHtml += `<div class="font-bold text-amber-500 text-xs border-l-2 border-amber-500 pl-2 mt-2"># 第 ${idx + 1} 次安科推演：</div>`;
        run.steps.forEach((s, sIdx) => {
          let stepBg = 'bg-slate-500/10'; let stepBorder = 'border-slate-500/20';
          let glowClass = ''; 
          if (s.outcome === '大成功') { stepBg = 'bg-emerald-950/40'; stepBorder = 'border-emerald-500/40'; glowClass = 'glow-cs'; }
          else if (s.outcome === '大失敗') { stepBg = 'bg-rose-950/40'; stepBorder = 'border-rose-500/40'; glowClass = 'glow-cf'; }
          
          const levelNum = parseInt(s.levelStr.replace('s', ''));
          if (levelNum >= 3) glowClass = 'glow-high';
          
          const isLast = (sIdx === run.steps.length - 1);
          let stackBadge = '';
          if (isLast && s.levelStr !== 'custom') {
            if (run.finalStack > 0 && run.baseOutcome) {
              if (run.baseOutcome === '大成功') stackBadge = `<span class="px-2 py-1 bg-emerald-500/20 text-emerald-500 border border-emerald-500/50 rounded-lg font-black text-[10px] md:text-xs">✨ 結算：${run.finalStack}重大成功</span>`;
              else stackBadge = `<span class="px-2 py-1 bg-rose-500/20 text-rose-500 border border-rose-500/50 rounded-lg font-black text-[10px] md:text-xs">💥 結算：${run.finalStack}重大失敗</span>`;
            } else {
              stackBadge = `<span class="px-2 py-1 bg-slate-500/10 text-muted border border-slate-500/30 rounded-lg text-[10px] md:text-[11px] font-bold">⚪ 結算：0 Stacks</span>`;
            }
          }

          flowHtml += `
            <div class="${stepBg} ${stepBorder} ${glowClass} border rounded-xl p-3 flex flex-col md:flex-row md:items-center justify-between text-xs transition-all gap-2">
              <div class="flex flex-wrap items-center gap-2">
                <span class="px-2 py-0.5 bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 font-mono rounded text-[10px] font-bold">${s.levelStr}</span>
                <span class="px-2 py-0.5 bg-slate-500/20 text-muted font-mono rounded text-[10px] font-bold">Step ${sIdx + 1}</span>
                <span class="font-bold leading-relaxed">${s.msg}</span>
              </div>
              <div class="flex flex-wrap items-center gap-2 justify-end">
                ${s.extraD2 ? `<span class="font-mono bg-slate-500/20 px-2 py-0.5 rounded text-amber-500 text-[10px] md:text-xs">1d2=${s.extraD2}</span>` : ''}
                ${stackBadge}
                <span class="text-xs md:text-sm font-black text-amber-500 font-mono">最終: ${s.final}</span>
              </div>
            </div>
          `;
        });
      });
      chainFlowDisplay.innerHTML = flowHtml;
      setTimeout(() => { diceContainer.scrollTop = diceContainer.scrollHeight; }, 50);
    }

    function renderTotalSum(allRuns, boost) {
      let totalSum = 0, nonTriggerSum = 0, formulaParts = [], hasTrigger = false;
      allRuns.forEach(run => {
        if (run.steps[0].levelStr === 'custom') return;
        
        const lastStep = run.steps[run.steps.length - 1];
        const endsInS0 = (lastStep.levelStr === 's0');
        const hasChain = run.steps.length > 1;

        if (hasChain) hasTrigger = true;

        if (!hasChain) {
          const s0Step = run.steps[0];
          totalSum += s0Step.final;
          nonTriggerSum += s0Step.final;
          const delta = s0Step.final - s0Step.raw;
          let partStr = delta !== 0 ? `(${s0Step.raw}${delta > 0 ? '+' : ''}${delta})` : `${s0Step.raw}`;
          formulaParts.push(partStr);
        } else if (endsInS0) {
          const s0Step = lastStep;
          totalSum += s0Step.final;
          const delta = s0Step.final - s0Step.raw;
          let partStr = delta !== 0 ? `(${s0Step.raw}${delta > 0 ? '+' : ''}${delta})` : `${s0Step.raw}`;
          formulaParts.push(`<span class="text-emerald-400 font-bold" title="退回s0採計">${partStr}</span>`);
        } else {
          formulaParts.push(`<span class="text-amber-500/50 line-through font-mono" title="觸發連鎖且未退回s0，不計入總和">(${run.steps[0].final})</span>`);
        }
      });

      if (formulaParts.length === 0) { totalSummary.classList.add('hidden'); return 0; }

      if (formulaParts.length > 1 || boost !== 0 || hasTrigger) {
        let sumHtml = `🧮 本輪總和：<span class="font-mono text-muted mx-2">${formulaParts.join(' + ')}</span> = <span class="text-amber-500 text-lg md:text-xl ml-1 cursor-pointer hover:opacity-80 transition-opacity" title="點擊複製總和" onclick="copyTotalSum(${totalSum})">${totalSum}</span>`;
        if (hasTrigger) sumHtml += `<span class="ml-2 md:ml-3 text-xs text-muted font-normal">（不含觸發連鎖骰：${nonTriggerSum}）</span>`;
        totalSummary.innerHTML = sumHtml; totalSummary.classList.remove('hidden');
      } else { totalSummary.classList.add('hidden'); }
      return totalSum;
    }

    function copyTotalSum(val) {
      navigator.clipboard.writeText(val.toString()).then(() => showToast(`📋 已複製總和：${val} 喵！`, 'success'));
    }

    // 核心執行邏輯，同步解放上限為 50
    function executeRoll(type) {
      playAnimation(); 
      let count = Math.max(1, Math.min(50, Math.floor(Number(countInput.value)) || 1)); 
      countInput.value = count;
      const boost = Math.floor(Number(boostInput.value)) || 0; 
      const boostMode100 = boostMode100Input.value;
      let targetVal = Math.max(1, Math.min(100, Math.floor(Number(targetValueInput.value)) || 50)); 
      targetValueInput.value = targetVal;
      saveSettings(); 

      let debugSeq = [], isDebug = false;
      if (debugSeqInput && debugSeqInput.value.trim() !== '') {
        isDebug = true; debugSeq = debugSeqInput.value.split(',').map(s => Number(s.trim())).filter(n => !isNaN(n));
      }
      const debugState = { index: 0 };
      emptyState.classList.add('hidden'); chainFlowDisplay.classList.remove('hidden'); totalSummary.classList.add('hidden'); 

      let allRuns = [], totalSuccessStacks = 0, totalFailStacks = 0;
      for (let i = 0; i < count; i++) {
        const run = rollChainEngine(type, boost, targetVal, checkMode, debugSeq, debugState, boostMode100);
        allRuns.push(run);
        if (run.finalStack > 0 && run.baseOutcome) {
          if (run.baseOutcome === '大成功') totalSuccessStacks += run.finalStack;
          if (run.baseOutcome === '大失敗') totalFailStacks += run.finalStack;
        }
      }
      renderBadges(totalSuccessStacks, totalFailStacks, isDebug);
      renderFlow(allRuns, count);
      const totalSum = renderTotalSum(allRuns, boost);

      let detailArr = [];
      allRuns.forEach((run, idx) => {
        if (run.steps[0].levelStr === 'custom') return;
        let stepStrArr = run.steps.map(s => {
          let str = `${s.levelStr}:${s.type}=${s.raw}`;
          if (s.extraD2) str += `(1d2=${s.extraD2})`;
          if (s.outcome === '大成功') str += '✨';
          if (s.outcome === '大失敗') str += '💥';
          return str;
        });
        let runStr = stepStrArr.join('→');
        if (run.steps.length > 1) runStr = `[觸發]${runStr}`;
        if (count > 1) runStr = `[${idx + 1}] ${runStr}`;
        detailArr.push(runStr);
      });
      const detailText = detailArr.join(' | ');
      const boostText = boost !== 0 ? ` (B:${boost >= 0 ? '+' : ''}${boost})` : '';
      const sumText = totalSummary.classList.contains('hidden') ? '' : ` ｜ 總和: ${totalSum}`;
      const debugText = isDebug ? '[🧪測試] ' : '';
      const summaryText = `${debugText}${count}x ${type}${boostText} [${checkMode.toUpperCase()}:${targetVal}] ➔ 淨計: ${totalSuccessStacks}成功 / ${totalFailStacks}失敗${sumText}`;
      
      addHistory(summaryText, detailText);

      if (autoCopyToggle.checked) {
        const parts = allRuns.map(run => {
          if (run.steps[0].levelStr === 'custom') return '';
          const lastStep = run.steps[run.steps.length - 1];
          const hasChain = run.steps.length > 1;
          const endsInS0 = (lastStep.levelStr === 's0');
          
          if (!hasChain) {
            const s0Step = run.steps[0];
            const delta = s0Step.final - s0Step.raw;
            return delta !== 0 ? `(${s0Step.raw}${delta > 0 ? '+' : ''}${delta})` : `${s0Step.raw}`;
          } else if (endsInS0) {
            const s0Step = lastStep;
            const delta = s0Step.final - s0Step.raw;
            return delta !== 0 ? `(${s0Step.raw}${delta > 0 ? '+' : ''}${delta})` : `${s0Step.raw}`;
          }
          return '';
        }).filter(Boolean);

        if (parts.length > 0) {
          const prefix = count + 'd' + (type.includes('d') ? type.split('d')[1] : type);
          const formulaString = `${prefix}=${parts.join('+')}=${totalSum}`;
          navigator.clipboard.writeText(formulaString).then(() => showToast(`📋 已自動複製：${formulaString}`, 'success'));
        }
      }
    }

    function addHistory(summary, detail) {
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      history.unshift({ time: now, summary: summary, detail: detail });
      if (history.length > 200) history.pop(); 
      saveHistory(); renderHistory();
    }

    function formatOutputText(text) {
      if (outputFormatInput.value === 'markdown') return `**${text}**`;
      return text;
    }

    function renderHistory() {
      if (!Array.isArray(history) || history.length === 0) {
        historyLog.innerHTML = `<div class="text-muted text-center py-4">尚無推演紀錄</div>`;
        return;
      }
      historyLog.innerHTML = history.map((item, index) => {
        const sText = item.summary || item.text || '無摘要';
        const dText = item.detail || '';
        return `
          <div class="flex flex-col py-2 border-b border-default last:border-0 gap-1 cursor-pointer hover:bg-slate-500/10 rounded px-1 transition-colors virtual-scroll-item" onclick="copyHistory(${index})">
            <div class="flex justify-between items-center gap-2 pointer-events-none">
              <span class="text-slate-300 text-[11px] md:text-xs font-bold leading-tight break-all">${sText}</span>
              <span class="text-[10px] text-muted shrink-0">${item.time}</span>
            </div>
            ${dText ? `<span class="text-[10px] text-indigo-400 font-mono leading-tight break-all bg-indigo-500/10 px-2 py-1 rounded border-l-2 border-indigo-500/50 pointer-events-none">${dText}</span>` : ''}
          </div>
        `;
      }).join('');
    }

    function copyHistory(index) {
      const item = history[index];
      if (!item) return;
      let textToCopy = item.summary;
      if (item.detail) textToCopy += `\n詳細軌跡：${item.detail}`;
      textToCopy = formatOutputText(textToCopy);
      navigator.clipboard.writeText(textToCopy).then(() => showToast('📋 已複製到剪貼簿喵！', 'success'));
    }

    function exportHistoryToCSV() {
      if (!Array.isArray(history) || history.length === 0) return showToast('❌ 目前沒有紀錄可以匯出喵！', 'error');
      let csvContent = "\uFEFF時間,摘要,詳細骰子軌跡\n";
      const reversedHistory = [...history].reverse();
      reversedHistory.forEach(item => {
        const sText = item.summary || item.text || '';
        const dText = item.detail || '';
        const safeSummary = `"${sText.replace(/"/g, '""')}"`;
        const safeDetail = `"${dText.replace(/"/g, '""')}"`;
        csvContent += `${item.time},${safeSummary},${safeDetail}\n`;
      });
      const defaultFileName = `Fate_Classic_Log_${new Date().toISOString().slice(0,10)}.csv`;
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.save_csv(csvContent, defaultFileName).then((response) => {
          if (response && response.success) showToast('✅ 檔案已儲存喵！', 'success');
        });
      } else {
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url); link.setAttribute("download", defaultFileName);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
        showToast('✅ 檔案已下載喵！', 'success');
      }
    }

    document.addEventListener('keydown', function(e) {
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON' || e.target.isContentEditable) return;
      
      const settingsModal = document.getElementById('settings-modal');
      const confirmModal = document.getElementById('confirm-modal');
      const isModalOpen = (settingsModal && !settingsModal.classList.contains('hidden')) || 
                          (confirmModal && !confirmModal.classList.contains('hidden'));
      if (isModalOpen) return;

      if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); executeRoll('1d100'); }
      else if (e.key === '1') executeRoll('1d10');
      else if (e.key === '2') executeRoll('1d100');
    });

    window.addEventListener('DOMContentLoaded', loadSettings);
  </script>
</body>
</html>
